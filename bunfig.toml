telemetry = false

[install]
exact = true
linker = "isolated" # phantom deps fail loudly
minimumReleaseAge = 259200 # 3 days: supply-chain buffer

# Only scripts/ runs on bun test; the Worker's tests run on Vitest in workerd (vitest.config.ts).
[test]
root = "scripts"
randomize = true
coverage = true
coverageSkipTestFiles = true
# Plural keys: Bun silently ignores singular ones. Bun measures no branches.
coverageThreshold = { lines = 1.0, functions = 1.0, statements = 1.0 }
coverageReporter = ["text"]
# src/ is covered by Vitest in workerd; Bun measures only the scripts.
coveragePathIgnorePatterns = ["src/**"]
