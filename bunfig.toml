# Bun Configuration File
# https://bun.sh/docs/runtime/bunfig

# ═══════════════════════════════════════════════════════════════════════════════
# Runtime Configuration
# ═══════════════════════════════════════════════════════════════════════════════

logLevel = "warn"
telemetry = false

# ═══════════════════════════════════════════════════════════════════════════════
# Test Configuration
# ═══════════════════════════════════════════════════════════════════════════════

[test]

# Reduced memory for CI
smol = true

# V8 coverage (built-in, no istanbul)
# Note: coverageThreshold omitted — broken in Bun 1.3.14 (exit code 1 even when met)
# 100% coverage enforced via vitest.config.ts thresholds for integration tests
coverage = true
coverageSkipTestFiles = true
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coveragePathIgnorePatterns = ["**/*.config.*"]

# Execution
randomize = true
seed = 42
retry = 1

# Bun 1.3+ reporters
[test.reporter]
junit = "test-results.xml"

# ═══════════════════════════════════════════════════════════════════════════════
# Package Manager Configuration
# ═══════════════════════════════════════════════════════════════════════════════

[install]
exact = true
saveTextLockfile = true
linker = "isolated"
auto = "fallback"
globalStore = true

# ═══════════════════════════════════════════════════════════════════════════════
# Run Configuration
# ═══════════════════════════════════════════════════════════════════════════════

[run]
shell = "bun"
