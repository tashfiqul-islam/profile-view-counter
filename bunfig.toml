# Bun Configuration File
# https://bun.sh/docs/runtime/bunfig

# ═══════════════════════════════════════════════════════════════════════════════
# Runtime Configuration
# ═══════════════════════════════════════════════════════════════════════════════

logLevel = "warn"
telemetry = false

# ═══════════════════════════════════════════════════════════════════════════════
# Test Configuration
# ═══════════════════════════════════════════════════════════════════════════════

[test]
# Unit tests run via bun:test (badge-generator only)
root = "test"

# Reduced memory mode for CI environments
smol = true

# Coverage settings (bun:test built-in V8 coverage)
coverage = true
coverageSkipTestFiles = true
coverageThreshold = { line = 100, function = 100, statement = 100 }
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"

# Test execution
randomize = true
seed = 42

# Reporter configuration (Bun 1.3+)
[test.reporter]
junit = "test-results.xml"

# ═══════════════════════════════════════════════════════════════════════════════
# Package Manager Configuration
# ═══════════════════════════════════════════════════════════════════════════════

[install]
# Lock exact versions for reproducible builds
exact = true

# Text-based lockfile (bun.lock) - easier to review in PRs
saveTextLockfile = true

# Stricter linker - phantom deps fail immediately
linker = "isolated"

# Auto-install behavior
auto = "fallback"

[install.cache]
disableManifest = false

[install.lockfile]
save = true

# ═══════════════════════════════════════════════════════════════════════════════
# Run Configuration
# ═══════════════════════════════════════════════════════════════════════════════

[run]
# Use Bun's shell for cross-platform consistency
shell = "bun"
