name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One queue per ref and event: a manual run on main never replaces a pending push run (and its
# deploy); runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out this repo
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain and dependencies
        id: setup
        uses: $/.github/actions/setup
        with:
          tools: bun node actionlint zizmor shellcheck lychee

      # The gate (`bun run check` locally), one step per tool so a failure names itself. Where a tool
      # can speak GitHub's annotation format, errors land inline on the PR diff; `if: !cancelled()`
      # keeps every check reporting even when an earlier one fails (once setup succeeded).
      - name: Typecheck (wrangler types + tsc)
        run: |
          bun run cf-typegen
          echo "::add-matcher::.github/matchers/tsc.json"
          # Same two programs as `bun run typecheck`; plain output so the matcher can annotate it.
          bunx tsc -p tsconfig.json --pretty false
          bunx tsc -p scripts/tsconfig.json --pretty false

      - name: Lint, type-aware (oxlint)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run lint --format github

      - name: Format check (oxfmt)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run format:check

      - name: Check agent docs (router size, guide openings, links)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run docs:check

      - name: Test the Worker in workerd, 100 % coverage (Vitest)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run test:worker

      - name: Test scripts, 100 % coverage (bun test)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run test:scripts

      - name: Lint workflows (actionlint)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          # shellcheck disable=SC2016 # `$err` is a Go template variable, not a shell one
          actionlint -format '{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}},title=actionlint {{$err.Kind}}::{{$err.Message}}
          {{end}}'

      - name: Audit workflows (zizmor)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: zizmor --offline --persona auditor --format github .github

      - name: Check docs links and anchors (lychee, offline)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false" # use the tools this job installed, nothing more
        run: mise run lint-docs

  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # read the dependency diff
    steps:
      - name: Review dependency changes for vulnerabilities
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate

  # Deploys exactly the commit the gate just tested: same workflow run, same SHA, no workflow_run.
  # A manual run on main redeploys (recovery when a push run was skipped or failed).
  deploy:
    name: Deploy
    needs: check
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: deploy
      cancel-in-progress: false
    environment:
      name: production
      url: https://profile-view-counter.tashfiq61.workers.dev/health
    permissions:
      contents: read # check out this repo
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain and dependencies
        uses: $/.github/actions/setup
        with:
          tools: bun node

      - name: Apply D1 migrations, then deploy the Worker (wrangler)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bun run db:migrate:prod
          bun run deploy

  release:
    name: Release
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # create the tag and the GitHub release (no commits to main)
      issues: write # comment on issues fixed by the release
      pull-requests: write # comment on PRs included in the release
    steps:
      - name: Check out repository (full history for versioning)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up toolchain and dependencies
        uses: $/.github/actions/setup
        with:
          tools: bun node

      # Tag + GitHub release with notes; nothing is committed back, so `main` stays fully protected.
      - name: Tag and publish GitHub release (semantic-release)
        run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
