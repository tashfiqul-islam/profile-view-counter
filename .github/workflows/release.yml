name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable debug logging"
        required: false
        type: choice
        options: ["true", "false"]
      dry_run:
        description: "Run in dry-run mode"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  attestations: write

env:
  NODE_ENV: production
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  LEFTHOOK: "0"

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      version: ${{ steps.check-release.outputs.new_release_version }}
      skip_ci: ${{ steps.skip-ci-check.outputs.skip_ci }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "lts/*"

      - name: Cache Bun modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Check for skip CI commits
        id: skip-ci-check
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | grep -qE '\[skip ci\]|\[ci skip\]|\[no ci\]|\[skip actions\]'; then
            echo "skip_ci=true" >> $GITHUB_OUTPUT
          else
            echo "skip_ci=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate project
        if: env.DRY_RUN != 'true' && steps.skip-ci-check.outputs.skip_ci != 'true'
        run: bun run cf-typegen && bun run typecheck && bun run test

      - name: Run Semantic Release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG_ENABLED: ${{ github.event.inputs.debug }}
          DRY_RUN_ENABLED: ${{ github.event.inputs.dry_run }}
        run: |
          FLAGS=""
          if [[ "$DRY_RUN_ENABLED" == "true" ]]; then
            FLAGS="--dry-run"
          fi
          if [[ "$DEBUG_ENABLED" == "true" ]]; then
            FLAGS="${FLAGS} --debug"
          fi
          npx semantic-release $FLAGS

      - name: Check for new release
        id: check-release
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo 'none')
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo 'none')
          if [ "$PREVIOUS_TAG" != "$LATEST_TAG" ] && [ "$LATEST_TAG" != "none" ]; then
            echo "new_release_version=${LATEST_TAG#v}" >> $GITHUB_OUTPUT
          else
            echo "new_release_version=" >> $GITHUB_OUTPUT
          fi

      - name: Attest release provenance
        if: steps.check-release.outputs.new_release_version != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            CHANGELOG.md
            package.json
            bun.lock

  generate-summary:
    name: Release Summary
    needs: [release]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Generate summary
        env:
          VERSION: ${{ needs.release.outputs.version }}
          SKIP_CI: ${{ needs.release.outputs.skip_ci }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          {
            echo "## Semantic Release Results"
            echo ""
            if [[ "$VERSION" != "" ]]; then
              echo "✅ **Version $VERSION released successfully**"
              echo "🔒 **SLSA provenance generated**"
            elif [[ "$DRY_RUN" == "true" ]]; then
              echo "✅ **Dry run completed successfully**"
            elif [[ "$RELEASE_RESULT" != "success" ]]; then
              echo "❌ **Release process failed**"
            else
              echo "ℹ️ **No new version released**"
              if [[ "$SKIP_CI" == "true" ]]; then
                echo "Expected for commits with [skip ci]."
              else
                echo "No semantic changes detected in commit messages."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
